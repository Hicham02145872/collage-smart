<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#efefef;background:transparent;overflow:hidden}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 10px}button{border:1px solid #737373;border-radius:7px;background:#383838;color:#f1f1f1;padding:8px 12px;font:inherit;cursor:pointer}button:hover{background:#484848}button:disabled{opacity:.4;cursor:default}#status{font-weight:600;margin-right:auto}.hint{color:#bdbdbd;font-size:12px;margin:8px 0}canvas{width:88%;max-width:640px;margin:0 auto;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;overscroll-behavior:none;cursor:default;background:white;border:1px solid #ccd2dc;box-shadow:0 5px 18px #163b3912;border-radius:3px;outline:none}.saved{color:#9cdeb6}
button:focus-visible,canvas:focus-visible{outline:2px solid #80baff;outline-offset:2px}button{min-height:40px}#status{font-size:12px}.hint{line-height:1.5}</style>
<div class="tools" role="toolbar" aria-label="Outils de la photo"><span id="status" role="status" aria-live="polite">Clique sur une photo pour la modifier</span><button id="undo" disabled title="Annuler la dernière retouche (Ctrl+Z)">Annuler</button><button id="redo" disabled title="Rétablir la retouche (Ctrl+Maj+Z)">Rétablir</button><button id="fit" title="Conserver toute la photo dans son cadre, avec un fond flouté si nécessaire" disabled>Afficher la photo entière</button></div>
<canvas id="board" draggable="false" tabindex="0" aria-label="Planche A4 interactive : cliquer une photo, glisser pour cadrer, molette pour zoomer"></canvas>
<div class="hint">Glisser : déplacer · Molette / coins : zoomer · Poignée ↻ : tourner · Double-clic : cadrage auto. La planche et les rectangles restent fixes.</div>
<script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
let data=null,selected=-1,frames=[],background=null,drag=null,timer=null,serial=0,lastToken=null,lastHeight=0;
const cache=new Map();
let histories=[],positions=[];
function shot(f){return {viewport:[...f.viewport],rotation:f.rotation||0}}
function historyButtons(){document.getElementById('undo').disabled=selected<0||!(positions[selected]>0);document.getElementById('redo').disabled=selected<0||!(positions[selected]<histories[selected]?.length-1)}
function remember(){let h=histories[selected],now=shot(frames[selected]);if(JSON.stringify(h[positions[selected]])!==JSON.stringify(now)){h.splice(positions[selected]+1);h.push(now);if(h.length>50)h.shift();positions[selected]=h.length-1}historyButtons()}
function travel(delta){if(selected<0)return;let pos=positions[selected]+delta,h=histories[selected];if(pos<0||pos>=h.length)return;clearTimeout(timer);positions[selected]=pos;frames[selected].viewport=[...h[pos].viewport];frames[selected].rotation=h[pos].rotation;draw();post('history');historyButtons()}

function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function resize(){if(!data)return;let height=Math.ceil(document.body.getBoundingClientRect().height)+4;if(height!==lastHeight){lastHeight=height;send('streamlit:setFrameHeight',{height})}}
function picture(src){if(!cache.has(src)){let im=new Image();im.src=src;cache.set(src,im);im.onload=()=>draw()}return cache.get(src)}
function post(action='edit'){if(selected<0)return;let f=frames[selected];if(action!=='history')remember();send('streamlit:setComponentValue',{value:{token:data.token,id:Date.now()+'-'+(++serial),frame:selected,action,viewport:f.viewport,rotation:f.rotation||0},dataType:'json'});status.textContent='Photo '+(selected+1)+' · cadrage enregistré';status.className='saved'}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>post(),300)}
function point(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*data.width/r.width,(e.clientY-r.top)*data.height/r.height]}
function select(i){selected=i;document.getElementById('fit').disabled=i<0;historyButtons();status.className='';status.textContent=i<0?'Clique sur une photo':'Photo '+(i+1)+' sélectionnée';draw()}
function draw(){if(!data||!background||!background.complete)return;const scale=canvas.width/data.width;ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,data.width,data.height);ctx.drawImage(background,0,0,data.width,data.height);
frames.forEach((f,i)=>{let im=picture(f.image);if(!im.complete||!im.naturalWidth)return;let [l,t,r,b]=f.box,w=r-l,h=b-t,[x,y,x1,y1]=f.viewport,cw=x1-x,ch=y1-y;
ctx.save();ctx.beginPath();ctx.rect(l,t,w,h);ctx.clip();ctx.fillStyle='#ddd';ctx.fillRect(l,t,w,h);
// Same full-frame blurred fallback as the Python exporter.
if(f.rotation||x<0||y<0||x1>f.width||y1>f.height){let ratio=Math.max(w/im.naturalWidth,h/im.naturalHeight);ctx.save();ctx.filter='blur('+Math.max(w,h)/24+'px)';ctx.drawImage(im,l+(w-im.naturalWidth*ratio)/2-w*.08,t+(h-im.naturalHeight*ratio)/2-h*.08,im.naturalWidth*ratio+w*.16,im.naturalHeight*ratio+h*.16);ctx.restore()}
ctx.translate(l+w/2,t+h/2);ctx.rotate((f.rotation||0)*Math.PI/180);ctx.translate(-l-w/2,-t-h/2);
ctx.drawImage(im,l-x/cw*w,t-y/ch*h,f.width/cw*w,f.height/ch*h);
ctx.restore();if(i===selected){let unit=data.width/canvas.getBoundingClientRect().width;ctx.strokeStyle='#1675ed';ctx.lineWidth=1.5*unit;ctx.strokeRect(l,t,w,h);let s=5*unit;ctx.fillStyle='white';[[l,t],[r,t],[l,b],[r,b]].forEach(([a,c])=>{ctx.fillRect(a-s/2,c-s/2,s,s);ctx.strokeRect(a-s/2,c-s/2,s,s)});let rh=[l+w/2,t+14*unit];ctx.beginPath();ctx.arc(rh[0],rh[1],8*unit,0,2*Math.PI);ctx.fill();ctx.stroke();ctx.font=(13*unit)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#1675ed';ctx.fillText('↻',rh[0],rh[1])}});resize()}
function zoom(factor,anchor){if(selected<0)return;let f=frames[selected],[x,y,x1,y1]=f.viewport,[l,t,r,b]=f.box,w=x1-x,h=y1-y,neww=Math.max(f.width/12,Math.min(f.width*4,w*factor)),k=neww/w,newh=h*k,theta=(f.rotation||0)*Math.PI/180,dx=anchor?(anchor[0]-(l+r)/2)/(r-l)*w:0,dy=anchor?(anchor[1]-(t+b)/2)/(b-t)*h:0,cx=(x+x1)/2+(1-k)*(Math.cos(theta)*dx+Math.sin(theta)*dy),cy=(y+y1)/2+(1-k)*(-Math.sin(theta)*dx+Math.cos(theta)*dy);f.viewport=[cx-neww/2,cy-newh/2,cx+neww/2,cy+newh/2];draw()}
canvas.addEventListener('dragstart',e=>{e.preventDefault();e.stopPropagation()});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();clearTimeout(timer);if(!data)return;let p=point(e),i=frames.findIndex(f=>p[0]>=f.box[0]&&p[0]<=f.box[2]&&p[1]>=f.box[1]&&p[1]<=f.box[3]);select(i);if(i<0)return;canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);let [l,t,r,b]=frames[i].box,unit=data.width/canvas.getBoundingClientRect().width,tolerance=7*unit,corner=[[l,t],[r,t],[l,b],[r,b]].some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<tolerance),turn=e.altKey||Math.hypot(p[0]-(l+r)/2,p[1]-t-14*unit)<10*unit;drag={p,viewport:[...frames[i].viewport],corner,turn,rotation:frames[i].rotation||0,moved:false};canvas.style.cursor=turn?'crosshair':corner?'nwse-resize':'grabbing'});
canvas.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();e.stopPropagation();let p=point(e),f=frames[selected],[l,t,r,b]=f.box,[x,y,x1,y1]=drag.viewport;if(Math.hypot(p[0]-drag.p[0],p[1]-drag.p[1])<2*data.width/canvas.getBoundingClientRect().width&&!drag.moved)return;drag.moved=true;if(drag.turn){let cx=(l+r)/2,cy=(t+b)/2;f.rotation=(drag.rotation+(Math.atan2(p[1]-cy,p[0]-cx)-Math.atan2(drag.p[1]-cy,drag.p[0]-cx))*180/Math.PI+360)%360;if(e.shiftKey)f.rotation=Math.round(f.rotation/15)*15;draw();return}if(drag.corner){let cx=(l+r)/2,cy=(t+b)/2,factor=Math.hypot(drag.p[0]-cx,drag.p[1]-cy)/Math.max(10,Math.hypot(p[0]-cx,p[1]-cy));f.viewport=[...drag.viewport];zoom(factor);return}let dx=(p[0]-drag.p[0])*(x1-x)/(r-l),dy=(p[1]-drag.p[1])*(y1-y)/(b-t),theta=(f.rotation||0)*Math.PI/180,rx=Math.cos(theta)*dx+Math.sin(theta)*dy,ry=-Math.sin(theta)*dx+Math.cos(theta)*dy;f.viewport=[x-rx,y-ry,x1-rx,y1-ry];draw()});
canvas.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(drag){let changed=drag.moved;drag=null;canvas.style.cursor='grab';if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(changed)post()}});
canvas.addEventListener('pointercancel',()=>{drag=null});
canvas.addEventListener('wheel',e=>{if(selected<0)return;e.preventDefault();e.stopPropagation();zoom(Math.exp(Math.max(-100,Math.min(100,e.deltaY))*.002),point(e));schedule()},{passive:false});
canvas.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();travel(e.shiftKey?1:-1);return}if(e.key==='Tab'&&selected<0){select(0);return}if(selected<0)return;let f=frames[selected],v=f.viewport,k=(e.shiftKey?10:2)*(v[2]-v[0])/(f.box[2]-f.box[0]),d={ArrowLeft:[k,0],ArrowRight:[-k,0],ArrowUp:[0,k],ArrowDown:[0,-k]}[e.key];if(d){e.preventDefault();f.viewport=[v[0]+d[0],v[1]+d[1],v[2]+d[0],v[3]+d[1]];draw();schedule()}});
canvas.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();if(selected<0)return;frames[selected].viewport=[...frames[selected].auto];frames[selected].rotation=0;draw();post('reset')});
document.getElementById('undo').onclick=()=>travel(-1);document.getElementById('redo').onclick=()=>travel(1);
document.getElementById('fit').onclick=()=>{if(selected<0)return;clearTimeout(timer);let f=frames[selected],theta=(f.rotation||0)*Math.PI/180,co=Math.abs(Math.cos(theta)),si=Math.abs(Math.sin(theta)),bw=f.width*co+f.height*si,bh=f.width*si+f.height*co,ratio=(f.box[2]-f.box[0])/(f.box[3]-f.box[1]),w=Math.max(bw,bh*ratio),h=w/ratio;f.viewport=[(f.width-w)/2,(f.height-h)/2,(f.width+w)/2,(f.height+h)/2];draw();post()};
window.addEventListener('message',event=>{if(event.data.type!=='streamlit:render')return;let args=event.data.args;if(lastToken!==args.token){selected=-1;cache.clear();histories=[];positions=[]}data=args;lastToken=args.token;background=picture(args.background);frames=args.frames.map(f=>({...f,viewport:[...f.viewport]}));frames.forEach((f,i)=>{if(!histories[i]){histories[i]=[shot(f)];positions[i]=0}});canvas.width=1600;canvas.height=Math.round(1600*args.height/args.width);select(selected);draw();resize()});
new ResizeObserver(resize).observe(document.body);send('streamlit:componentReady',{apiVersion:1});select(-1);
</script></html>
