<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",sans-serif;color:#f1f1f1;background:transparent}button{font:inherit;cursor:pointer;border:1px solid #747474;border-radius:5px;padding:10px 16px;min-height:44px;background:#373737;color:#fff}button:hover{background:#484848}button:focus-visible{outline:2px solid #80baff;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:#1763b6;border-color:#80baff}.primary:hover{background:#2374cd}.quiet{background:transparent;border-color:transparent;color:#c8d7ea}#launcher{display:flex;justify-content:flex-end;padding:3px 0 6px}#tour{background:#292929;border:1px solid #626262;border-radius:8px;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid #484848}.top span{color:#bdd8fa;font-size:12px;font-weight:600;letter-spacing:.05em}.body{display:grid;grid-template-columns:1fr 1fr;min-height:270px}.visual{position:relative;background:#1a1a1a;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual>img{display:block;width:100%;height:290px;object-fit:cover}.badge{position:absolute;left:12px;bottom:12px;font-size:11px;color:white;background:#171717df;padding:4px 8px;border-radius:4px}.content{padding:24px;display:flex;flex-direction:column;justify-content:center}h2{font-size:22px;line-height:1.25;margin:8px 0 14px}p{color:#ddd;margin:0 0 12px}.step{color:#b4cdea;font-size:12px}.tip{padding:10px 12px;background:#353b43;border-left:3px solid #80baff;color:#e0eafa;font-size:13px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #484848}.actions{display:flex;gap:8px}.dots{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#747474}.dot.active{background:#80baff}.photo-frame{width:165px;height:220px;border:3px solid #80baff;background:#151515;overflow:hidden;position:relative}.photo-frame img{width:100%;height:100%;object-fit:cover;display:block}.photo-frame.rotate img{transform:rotate(12deg) scale(1.25)}.photo-frame.fit img{object-fit:contain}.photo-frame.fit{background:#44564b}#tour[hidden],#launcher[hidden]{display:none}h2:focus{outline:none}@media(max-width:600px){.body{grid-template-columns:1fr}.visual{min-height:160px}.visual>img{height:180px}.content{padding:16px}h2{font-size:20px}.photo-frame{height:160px;width:120px;margin:10px}.bottom{flex-wrap:wrap;padding:12px}.top{padding:8px 12px}.quiet{padding:8px} .dots{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="launcher" hidden><button id="reopen">Revoir le guide photo</button></div>
<section id="tour" aria-label="Guide de première visite" hidden>
<div class="top"><span>BIENVENUE DANS COLLAGE SMART</span><button class="quiet" id="skip">Passer le guide</button></div>
<div class="body"><div class="visual" id="visual"></div><div class="content"><div class="step" id="counter" aria-live="polite"></div><h2 id="title" tabindex="-1"></h2><p id="description"></p><div class="tip" id="tip"></div></div></div>
<div class="bottom"><div class="dots" id="dots" aria-hidden="true"></div><div class="actions"><button id="previous">Précédent</button><button id="next" class="primary">Suivant</button></div></div>
</section>
<script>
const KEY='collage-smart-photo-guide-v1';let step=0,started=false,lastHeight=0;
const steps=[
{title:'1. Préparez votre commande',image:'prints.png',alt:'Une planche de dix photos et des tirages sur un bureau',text:'Dans le panneau de gauche, entrez le nom du client et cliquez sur « Appliquer le nom ». Importez vos photos, ou indiquez leur dossier.',tip:'Plus de 10 photos ? Les A4 sont créées automatiquement. Pour une vidéo, seule la première image est utilisée.'},
{title:'2. Recadrez directement la photo',image:'portrait.png',alt:'Portrait photographique avec de l’espace autour du visage',text:'Sur une A4, cliquez sur une photo pour la sélectionner. Maintenez le clic et glissez pour déplacer son contenu dans le rectangle.',tip:'Le rectangle et la planche restent fixes. Vérifiez que le visage est entièrement visible.',frame:'crop'},
{title:'3. Zoomez ou dézoomez',image:'mouse.png',alt:'Main sur une souris avec une molette visible',text:'Gardez la photo sélectionnée et placez le pointeur dessus. Tournez la molette vers le haut pour agrandir, vers le bas pour voir plus de la photo.',tip:'Vous pouvez aussi tirer un coin bleu. Pour annuler un geste, utilisez « Annuler ».'},
{title:'4. Tournez la photo',image:'portrait.png',alt:'Exemple de portrait légèrement tourné dans un cadre fixe',text:'Faites glisser la petite poignée ↻ située en haut de la photo sélectionnée. Seule la photo tourne dans son rectangle.',tip:'Maintenez Maj pour tourner par pas de 15°. Un double-clic sur la photo rétablit le cadrage automatique.',frame:'rotate'},
{title:'5. Gardez toute la photo',image:'portrait.png',alt:'Portrait entier contenu dans le rectangle',text:'Si une personne risque d’être coupée, sélectionnez la photo puis cliquez sur « Afficher la photo entière ». Vous pouvez aussi dézoomer ou déplacer la photo.',tip:'Un fond flouté remplit l’espace restant si nécessaire. Le message « Cadrage à vérifier » est une aide : vous gardez le choix final.',frame:'fit'},
{title:'6. Vérifiez, puis exportez',image:'prints.png',alt:'Exemple de planche photo prête à être imprimée',text:'Vérifiez toutes les A4, puis ouvrez « Exporter ». Choisissez JPG, PDF ou PNG et cliquez sur « Préparer toutes les planches ». Téléchargez ensuite le ZIP.',tip:'Les noms des fichiers suivent le client : nom du client, nom du client 1, nom du client 2… Téléchargez avant de fermer la session.'}
];
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function resize(){const h=Math.ceil(document.body.getBoundingClientRect().height)+6;if(h!==lastHeight){lastHeight=h;send('streamlit:setFrameHeight',{height:h})}}
function done(){try{localStorage.setItem(KEY,'done')}catch(e){}document.getElementById('tour').hidden=true;document.getElementById('launcher').hidden=false;document.getElementById('reopen').focus();resize()}
function show(focus=true){const s=steps[step];document.getElementById('tour').hidden=false;document.getElementById('launcher').hidden=true;document.getElementById('counter').textContent='ÉTAPE '+(step+1)+' SUR '+steps.length;document.getElementById('title').textContent=s.title;document.getElementById('description').textContent=s.text;document.getElementById('tip').textContent=s.tip;const visual=document.getElementById('visual');visual.replaceChildren();const im=document.createElement('img');im.src=s.image;im.alt=s.alt;im.onload=resize;if(s.frame){const frame=document.createElement('div');frame.className='photo-frame '+s.frame;frame.append(im);visual.append(frame)}else visual.append(im);const label=document.createElement('span');label.className='badge';label.textContent='Photo de démonstration générée par IA';visual.append(label);document.getElementById('previous').disabled=step===0;document.getElementById('next').textContent=step===steps.length-1?'Commencer':'Suivant';document.getElementById('dots').innerHTML=steps.map((_,i)=>'<span class="dot '+(i===step?'active':'')+'"></span>').join('');if(focus)document.getElementById('title').focus({preventScroll:true});resize()}
document.getElementById('next').onclick=()=>{if(step===steps.length-1)done();else{step++;show()}};
document.getElementById('previous').onclick=()=>{if(step>0){step--;show()}};
document.getElementById('skip').onclick=done;document.getElementById('reopen').onclick=()=>{step=0;show()};
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render'||started)return;started=true;let seen=false;try{seen=localStorage.getItem(KEY)==='done'}catch(e){}if(seen){document.getElementById('launcher').hidden=false;resize()}else show(false)});
new ResizeObserver(resize).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
